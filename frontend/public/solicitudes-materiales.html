<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes de Materiales - JDI Cleaning Services</title>
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-header {
            background: linear-gradient(135deg, #0099CC 0%, #00A651 100%);
            color: white;
            padding: 2rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 12px rgba(0, 153, 204, 0.2);
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .request-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        .request-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            transform: translateY(-2px);
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .request-info h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.1rem;
            color: #333;
        }

        .request-meta {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
            color: #666;
        }

        .request-meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-badge.approved {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .status-badge.delivered {
            background: #d1ecf1;
            color: #0c5460;
        }

        .request-items {
            margin: 1rem 0;
        }

        .request-item {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .item-name {
            font-weight: 500;
            color: #333;
        }

        .item-quantity {
            color: #0099CC;
            font-weight: 600;
        }

        .request-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .btn {
            padding: 0.625rem 1.25rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Poppins', sans-serif;
        }

        .btn-approve {
            background: #00A651;
            color: white;
        }

        .btn-approve:hover {
            background: #008040;
            transform: translateY(-2px);
        }

        .btn-reject {
            background: #f44336;
            color: white;
        }

        .btn-reject:hover {
            background: #d32f2f;
            transform: translateY(-2px);
        }

        .btn-deliver {
            background: #2196F3;
            color: white;
        }

        .btn-deliver:hover {
            background: #0b7dda;
            transform: translateY(-2px);
        }

        .btn-view {
            background: #666;
            color: white;
        }

        .btn-view:hover {
            background: #444;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #888;
        }

        .empty-state i {
            font-size: 5rem;
            opacity: 0.2;
            margin-bottom: 1rem;
        }

        .filter-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            background: white;
            padding: 1rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .filter-tab {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: 2px solid transparent;
            background: #f5f5f5;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .filter-tab.active {
            background: linear-gradient(135deg, #0099CC, #00A651);
            color: white;
            border-color: transparent;
        }

        .filter-tab:hover:not(.active) {
            border-color: #0099CC;
        }

        .request-notes {
            margin-top: 1rem;
            padding: 1rem;
            background: #fff9e6;
            border-left: 4px solid #ffc107;
            border-radius: 4px;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
    <main class="main-content">
        <div class="container">
            <!-- Back Button -->
            <div style="margin-bottom: 1.5rem;">
                <a href="/solicitar-material" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Volver a Solicitar Material
                </a>
            </div>

            <!-- Page Header -->
            <div class="page-header slide-up">
                <h1>
                    <i class="fas fa-clipboard-list"></i>
                    Solicitudes de Materiales
                </h1>
                <p>Gestiona y aprueba las solicitudes de materiales del equipo</p>
            </div>

            <!-- Filter Tabs -->
            <div class="filter-tabs slide-up" style="animation-delay: 0.1s;">
                <div class="filter-tab active" data-status="all">
                    <i class="fas fa-list"></i> Todas
                </div>
                <div class="filter-tab" data-status="pending">
                    <i class="fas fa-clock"></i> Pendientes
                </div>
                <div class="filter-tab" data-status="approved">
                    <i class="fas fa-check"></i> Aprobadas
                </div>
                <div class="filter-tab" data-status="rejected">
                    <i class="fas fa-times"></i> Rechazadas
                </div>
                <div class="filter-tab" data-status="delivered">
                    <i class="fas fa-truck"></i> Entregadas
                </div>
            </div>

            <!-- Requests List -->
            <div id="requestsList" class="slide-up" style="animation-delay: 0.2s;">
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Cargando solicitudes...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="scripts/auth.js"></script>
    <script src="scripts/solicitudes-materiales.js"></script>
</body>
</html>
