<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - JDI Cleaning Services</title>
    <script src="scripts/theme.js"></script>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .profile-container {
            max-width: 900px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .profile-banner {
            background: linear-gradient(135deg, #0099CC 0%, #0077AA 100%);
            padding: 3rem 2rem 4rem;
            text-align: center;
            position: relative;
        }

        .profile-avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        .profile-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: white;
            border: 6px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .profile-avatar-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 36px;
            height: 36px;
            background: #00A651;
            border-radius: 50%;
            border: 4px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.9rem;
        }

        .profile-name {
            color: white;
            font-size: 2rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .profile-role-badge {
            display: inline-block;
            padding: 0.5rem 1.25rem;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            color: white;
            font-weight: 500;
            font-size: 0.95rem;
            text-transform: capitalize;
        }

        .profile-form-section {
            padding: 2.5rem;
        }

        .section-title {
            font-size: 1.3rem;
            color: #333;
            margin: 0 0 1.75rem 0;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 600;
        }

        .section-title i {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #0099CC 0%, #0077AA 100%);
            color: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.75rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.65rem;
            color: #555;
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group label i {
            color: #0099CC;
            width: 18px;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1.1rem;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0099CC;
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 153, 204, 0.08);
        }

        .form-group input:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
            color: #999;
        }

        .form-divider {
            border: none;
            border-top: 2px solid #f0f0f0;
            margin: 2.5rem 0;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 2px solid #f0f0f0;
        }

        .btn {
            padding: 0.85rem 2rem;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
            border: 2px solid #e8e8e8;
        }

        .btn-secondary:hover {
            background: #e8e8e8;
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #0099CC 0%, #0077AA 100%);
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(0, 153, 204, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 153, 204, 0.4);
        }

        @media (max-width: 768px) {
            .profile-container {
                margin: 1.5rem auto;
                padding: 0 1rem;
            }

            .profile-banner {
                padding: 2rem 1.5rem 3rem;
            }

            .profile-avatar {
                width: 110px;
                height: 110px;
                font-size: 3rem;
            }

            .profile-name {
                font-size: 1.5rem;
            }

            .profile-form-section {
                padding: 1.5rem;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="animated-background">
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
    </div>

    <header class="header glass-effect">
        <div class="container">
            <div class="header-content">
                <button class="btn btn-secondary" onclick="window.location.href='/'">
                    <i class="fas fa-arrow-left"></i> Volver
                </button>
                <div class="logo-container">
                    <div class="logo-placeholder">
                        <i class="fas fa-user"></i>
                    </div>
                    <span class="logo-text">Mi Perfil</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="profile-container">
            <div class="profile-card">
                <!-- Banner con Avatar y Nombre -->
                <div class="profile-banner">
                    <div class="profile-avatar-container">
                        <div class="profile-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="profile-avatar-badge">
                            <i class="fas fa-check"></i>
                        </div>
                    </div>
                    <h1 class="profile-name" id="profileName">Cargando...</h1>
                    <span class="profile-role-badge" id="profileRole">-</span>
                </div>

                <!-- Formulario -->
                <form id="profileForm" class="profile-form-section">
                    <!-- Información Personal -->
                    <h2 class="section-title">
                        <i class="fas fa-user-edit"></i>
                        Información Personal
                    </h2>

                    <div class="form-group">
                        <label for="name">
                            <i class="fas fa-user"></i>
                            Nombre Completo *
                        </label>
                        <input type="text" id="name" required autocomplete="off" placeholder="Ingresa tu nombre completo">
                    </div>

                    <div class="form-group">
                        <label for="email">
                            <i class="fas fa-envelope"></i>
                            Email *
                        </label>
                        <input type="email" id="email" required autocomplete="off" placeholder="tu@email.com">
                    </div>

                    <div class="form-group">
                        <label for="phone">
                            <i class="fas fa-phone"></i>
                            Teléfono
                        </label>
                        <input type="tel" id="phone" autocomplete="off" placeholder="+1 (555) 123-4567">
                    </div>

                    <div class="form-group">
                        <label for="username">
                            <i class="fas fa-at"></i>
                            Usuario
                        </label>
                        <input type="text" id="username" disabled placeholder="usuario">
                    </div>

                    <!-- Divider -->
                    <hr class="form-divider">

                    <!-- Cambiar Contraseña -->
                    <h2 class="section-title">
                        <i class="fas fa-lock"></i>
                        Cambiar Contraseña
                    </h2>

                    <div class="form-group">
                        <label for="currentPassword">
                            <i class="fas fa-key"></i>
                            Contraseña Actual
                        </label>
                        <input type="password" id="currentPassword" autocomplete="off" placeholder="Ingresa tu contraseña actual">
                    </div>

                    <div class="form-group">
                        <label for="newPassword">
                            <i class="fas fa-lock"></i>
                            Nueva Contraseña
                        </label>
                        <input type="password" id="newPassword" autocomplete="off" placeholder="Mínimo 6 caracteres">
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">
                            <i class="fas fa-check-circle"></i>
                            Confirmar Nueva Contraseña
                        </label>
                        <input type="password" id="confirmPassword" autocomplete="off" placeholder="Repite tu nueva contraseña">
                    </div>

                    <!-- Actions -->
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='/'">
                            <i class="fas fa-times"></i>
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i>
                            Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="scripts/auth.js"></script>
    <script src="scripts/perfil.js"></script>
</body>
</html>
