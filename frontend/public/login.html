<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JDI Cleaning Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 400px;
            width: 100%;
            animation: slideIn 0.5s ease;
            position: relative;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .language-selector {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            display: flex;
            gap: 5px;
            background: rgba(255,255,255,0.2);
            padding: 5px;
            border-radius: 20px;
        }

        .language-btn {
            width: 35px;
            height: 35px;
            border: 2px solid transparent;
            background: rgba(255,255,255,0.3);
            color: white;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .language-btn:hover {
            background: rgba(255,255,255,0.5);
            transform: scale(1.1);
        }

        .language-btn.active {
            background: white;
            color: #667eea;
            border-color: white;
            transform: scale(1.15);
        }

        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .login-header i {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-body {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            font-family: 'Poppins', sans-serif;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.show {
            display: block;
            animation: shake 0.5s ease;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Selector de idioma -->
        <div class="language-selector">
            <button class="language-btn active" data-lang="es" title="Español">ES</button>
            <button class="language-btn" data-lang="en" title="English">EN</button>
            <button class="language-btn" data-lang="fr" title="Français">FR</button>
        </div>

        <div class="login-header">
            <i class="fas fa-broom"></i>
            <h1>JDI Cleaning Services</h1>
            <p data-i18n="subtitle">Sistema de Gestión</p>
        </div>
        
        <div class="login-body">
            <div id="alert" class="alert"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username" data-i18n="usernameLabel">Usuario o Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            data-i18n-placeholder="usernamePlaceholder"
                            placeholder="Ingresa tu usuario o email"
                            required
                            autocomplete="username"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" data-i18n="passwordLabel">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            data-i18n-placeholder="passwordPlaceholder"
                            placeholder="Ingresa tu contraseña"
                            required
                            autocomplete="current-password"
                        >
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    <span data-i18n="loginButton">Iniciar Sesión</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        // ================================================
        // TRADUCCIONES
        // ================================================
        const translations = {
            es: {
                subtitle: 'Sistema de Gestión',
                usernameLabel: 'Usuario o Email',
                usernamePlaceholder: 'Ingresa tu usuario o email',
                passwordLabel: 'Contraseña',
                passwordPlaceholder: 'Ingresa tu contraseña',
                loginButton: 'Iniciar Sesión',
                loggingIn: 'Iniciando sesión',
                loginSuccess: '¡Login exitoso! Redirigiendo...',
                loginError: 'Usuario o contraseña incorrectos',
                connectionError: 'Error de conexión con el servidor. Verifica que el backend esté corriendo.',
                fillAllFields: 'Por favor completa todos los campos'
            },
            en: {
                subtitle: 'Management System',
                usernameLabel: 'Username or Email',
                usernamePlaceholder: 'Enter your username or email',
                passwordLabel: 'Password',
                passwordPlaceholder: 'Enter your password',
                loginButton: 'Login',
                loggingIn: 'Logging in',
                loginSuccess: 'Login successful! Redirecting...',
                loginError: 'Incorrect username or password',
                connectionError: 'Connection error with server. Verify that backend is running.',
                fillAllFields: 'Please fill all fields'
            },
            fr: {
                subtitle: 'Système de Gestion',
                usernameLabel: 'Utilisateur ou Email',
                usernamePlaceholder: 'Entrez votre utilisateur ou email',
                passwordLabel: 'Mot de passe',
                passwordPlaceholder: 'Entrez votre mot de passe',
                loginButton: 'Se connecter',
                loggingIn: 'Connexion en cours',
                loginSuccess: 'Connexion réussie! Redirection...',
                loginError: 'Nom d\'utilisateur ou mot de passe incorrect',
                connectionError: 'Erreur de connexion avec le serveur. Vérifiez que le backend fonctionne.',
                fillAllFields: 'Veuillez remplir tous les champs'
            }
        };

        // ================================================
        // MANEJO DE IDIOMA
        // ================================================
        let currentLang = localStorage.getItem('language') || 'es';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('language', lang);
            document.documentElement.lang = lang;

            // Actualizar botones de idioma
            document.querySelectorAll('.language-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });

            // Actualizar textos
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.dataset.i18n;
                if (translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });

            // Actualizar placeholders
            document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
                const key = element.dataset.i18nPlaceholder;
                if (translations[lang][key]) {
                    element.placeholder = translations[lang][key];
                }
            });
        }

        // Configurar botones de idioma
        document.querySelectorAll('.language-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                setLanguage(btn.dataset.lang);
            });
        });

        // Establecer idioma inicial
        setLanguage(currentLang);

        // ================================================
        // LOGIN
        // ================================================
        const API_URL = 'http://localhost:3000/api';
        const loginForm = document.getElementById('loginForm');
        const btnLogin = document.getElementById('btnLogin');
        const alert = document.getElementById('alert');

        // Si ya hay token, redirigir al dashboard
        if (localStorage.getItem('token')) {
            window.location.href = '/';
        }

        function showAlert(messageKey, type = 'error') {
            const message = translations[currentLang][messageKey] || messageKey;
            alert.textContent = message;
            alert.className = `alert alert-${type} show`;
            
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showAlert('fillAllFields');
                return;
            }

            // Deshabilitar botón y mostrar loading
            btnLogin.disabled = true;
            const btnText = btnLogin.querySelector('[data-i18n="loginButton"]');
            const originalText = btnText.textContent;
            btnText.textContent = translations[currentLang].loggingIn;
            btnLogin.innerHTML = btnText.outerHTML + '<span class="loading"></span>';

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Guardar token, datos del usuario e idioma
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    showAlert('loginSuccess', 'success');
                    
                    // Redirigir al dashboard
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    showAlert('loginError');
                    btnLogin.disabled = false;
                    btnText.textContent = originalText;
                    btnLogin.innerHTML = btnText.outerHTML;
                }
            } catch (error) {
                console.error('Error de login:', error);
                showAlert('connectionError');
                btnLogin.disabled = false;
                btnText.textContent = originalText;
                btnLogin.innerHTML = btnText.outerHTML;
            }
        });

        // Permitir Enter en los campos
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
