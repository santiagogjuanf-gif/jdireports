<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Material - JDI Cleaning Services</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .form-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .form-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e0e0e0;
        }

        .form-header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .form-header i {
            font-size: 2rem;
            color: #0099CC;
        }

        .form-header h1 {
            font-size: 1.8rem;
            color: #333;
            margin: 0;
        }

        .cart-summary {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #0099CC 0%, #0077AA 100%);
            color: white;
            border-radius: 12px;
            font-weight: 500;
        }

        .materials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .material-card {
            padding: 1.5rem;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: white;
            transition: all 0.3s;
            cursor: pointer;
        }

        .material-card:hover {
            border-color: #0099CC;
            box-shadow: 0 4px 12px rgba(0, 153, 204, 0.1);
        }

        .material-card.selected {
            border-color: #0099CC;
            background: #e3f2fd;
        }

        .material-header {
            display: flex;
            align-items: start;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .material-name {
            font-weight: 600;
            color: #333;
            font-size: 1.1rem;
        }

        .material-unit {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: #f0f0f0;
            border-radius: 6px;
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
        }

        .material-description {
            color: #666;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        .material-stock {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        .stock-item {
            display: flex;
            flex-direction: column;
        }

        .stock-label {
            color: #888;
            font-size: 0.75rem;
        }

        .stock-value {
            color: #333;
            font-weight: 500;
        }

        .stock-value.low {
            color: #ff6b6b;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .quantity-btn {
            width: 32px;
            height: 32px;
            border: 2px solid #0099CC;
            background: white;
            color: #0099CC;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .quantity-btn:hover {
            background: #0099CC;
            color: white;
        }

        .quantity-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .quantity-input {
            width: 60px;
            text-align: center;
            padding: 0.5rem;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-weight: 500;
        }

        .cart-section {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .cart-header h3 {
            margin: 0;
            color: #333;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .clear-cart {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .clear-cart:hover {
            background: #ee5a6f;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: white;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .cart-item-info {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .cart-item-name {
            font-weight: 500;
            color: #333;
        }

        .cart-item-quantity {
            color: #0099CC;
            font-weight: 600;
        }

        .remove-item {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0.25rem 0.5rem;
            transition: all 0.2s;
        }

        .remove-item:hover {
            color: #ee5a6f;
        }

        .cart-empty {
            text-align: center;
            padding: 2rem;
            color: #888;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
        }

        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            min-height: 100px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        .form-group textarea:focus {
            outline: none;
            border-color: #0099CC;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            padding-top: 2rem;
            border-top: 2px solid #e0e0e0;
        }

        .btn {
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0099CC 0%, #0077AA 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 153, 204, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #555;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0099CC;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .search-box {
            margin-bottom: 1.5rem;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23888"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 0 0 1.48-5.34c-.47-2.78-2.79-5-5.59-5.34a6.505 6.505 0 0 0-7.27 7.27c.34 2.8 2.56 5.12 5.34 5.59a6.5 6.5 0 0 0 5.34-1.48l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0 .41-.41.41-1.08 0-1.49L15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>') no-repeat 0.75rem center;
            background-size: 20px;
        }

        .search-input:focus {
            outline: none;
            border-color: #0099CC;
        }

        @media (max-width: 768px) {
            .materials-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Fondo animado -->
    <div class="animated-background">
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="bubble bubble-4"></div>
        <div class="bubble bubble-5"></div>
        <div class="bubble bubble-6"></div>
    </div>

    <!-- Header -->
    <header class="header glass-effect">
        <div class="container">
            <div class="header-content">
                <div class="logo-container">
                    <div class="logo-placeholder">
                        <i class="fas fa-broom"></i>
                    </div>
                    <span class="logo-text">JDI Cleaning</span>
                </div>
                <div class="user-menu">
                    <div class="user-avatar">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=0099CC&color=fff" alt="Usuario">
                        <div class="status-indicator online"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Formulario -->
    <main class="main-content">
        <div class="container">
            <div class="form-container">
                <div class="form-header">
                    <div class="form-header-left">
                        <i class="fas fa-boxes"></i>
                        <div>
                            <h1>Solicitar Materiales</h1>
                            <p style="margin: 0; color: #888;">Seleccione los materiales que necesita</p>
                        </div>
                    </div>
                    <div style="display: flex; gap: 1rem; align-items: center;">
                        <button id="viewRequestsBtn" class="btn btn-secondary" style="display: none;">
                            <i class="fas fa-clipboard-list"></i>
                            Ver Solicitudes
                        </button>
                        <div class="cart-summary">
                            <i class="fas fa-shopping-cart"></i>
                            <span id="cartCount">0</span> material(es)
                        </div>
                    </div>
                </div>

                <!-- Carrito de compras -->
                <div class="cart-section" id="cartSection">
                    <div class="cart-header">
                        <h3><i class="fas fa-shopping-cart"></i> Materiales Seleccionados</h3>
                        <button class="clear-cart hidden" id="clearCartBtn">
                            <i class="fas fa-trash"></i> Vaciar Carrito
                        </button>
                    </div>
                    <div class="cart-items" id="cartItems">
                        <div class="cart-empty">
                            No ha seleccionado ningún material aún
                        </div>
                    </div>
                </div>

                <!-- Búsqueda -->
                <div class="search-box">
                    <input type="text" autocomplete="off" id="searchInput" class="search-input" placeholder="Buscar materiales...">
                </div>

                <!-- Grid de materiales -->
                <div class="materials-grid" id="materialsGrid">
                    <!-- Se llenará dinámicamente -->
                </div>

                <!-- Notas -->
                <div class="form-group">
                    <label for="notes">Notas / Información Adicional</label>
                    <textarea id="notes" name="notes" placeholder="Ej: Urgente - para orden grande del viernes"></textarea>
                </div>

                <!-- Botones -->
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='/'">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <button type="button" class="btn btn-primary" id="submitBtn" disabled>
                        <i class="fas fa-paper-plane"></i> Enviar Solicitud
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Enviando solicitud...</p>
        </div>
    </div>

    <script src="scripts/auth.js"></script>
    <script src="scripts/solicitar-material.js"></script>
</body>
</html>
