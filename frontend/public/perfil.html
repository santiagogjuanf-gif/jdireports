<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - JDI Cleaning Services</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="animated-background">
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
    </div>

    <header class="header glass-effect">
        <div class="container">
            <div class="header-content">
                <button class="btn btn-secondary" onclick="window.location.href='/'">
                    <i class="fas fa-arrow-left"></i> Volver
                </button>
                <div class="logo-container">
                    <div class="logo-placeholder">
                        <i class="fas fa-user"></i>
                    </div>
                    <span class="logo-text">Mi Perfil</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="form-container" style="max-width: 700px; margin: 2rem auto;">
                <div class="profile-header" style="text-align: center; padding: 2rem; margin-bottom: 2rem; background: var(--gradient-primary); border-radius: var(--radius-lg); color: white;">
                    <div style="width: 100px; height: 100px; margin: 0 auto 1rem; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem;">
                        <i class="fas fa-user"></i>
                    </div>
                    <h2 id="profileName">Cargando...</h2>
                    <p id="profileRole">-</p>
                </div>

                <form id="profileForm" style="background: rgba(255,255,255,0.95); padding: 2rem; border-radius: var(--radius-lg);">
                    <h3 style="margin-bottom: 1.5rem; color: var(--color-gray-600);"><i class="fas fa-user-edit"></i> Información Personal</h3>

                    <div class="form-group">
                        <label for="name">
                            <i class="fas fa-user"></i>
                            Nombre Completo *
                        </label>
                        <input type="text" id="name" required autocomplete="off" placeholder="Ingresa tu nombre completo">
                    </div>

                    <div class="form-group">
                        <label for="email">
                            <i class="fas fa-envelope"></i>
                            Email *
                        </label>
                        <input type="email" id="email" required autocomplete="off" placeholder="tu@email.com">
                    </div>

                    <div class="form-group">
                        <label for="phone">
                            <i class="fas fa-phone"></i>
                            Teléfono
                        </label>
                        <input type="tel" id="phone" autocomplete="off" placeholder="+1 (555) 123-4567">
                    </div>

                    <div class="form-group">
                        <label for="username">
                            <i class="fas fa-at"></i>
                            Usuario
                        </label>
                        <input type="text" id="username" disabled style="background: #f5f5f5; cursor: not-allowed;" placeholder="usuario">
                    </div>

                    <div style="border-top: 2px solid #e0e0e0; margin: 2rem 0; padding-top: 2rem;">
                        <h3 style="margin-bottom: 1.5rem; color: var(--color-gray-600);"><i class="fas fa-lock"></i> Cambiar Contraseña</h3>

                        <div class="form-group">
                            <label for="currentPassword">
                                <i class="fas fa-key"></i>
                                Contraseña Actual
                            </label>
                            <input type="password" id="currentPassword" autocomplete="off" placeholder="Ingresa tu contraseña actual">
                        </div>

                        <div class="form-group">
                            <label for="newPassword">
                                <i class="fas fa-lock"></i>
                                Nueva Contraseña
                            </label>
                            <input type="password" id="newPassword" autocomplete="off" placeholder="Mínimo 6 caracteres">
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">
                                <i class="fas fa-check-circle"></i>
                                Confirmar Nueva Contraseña
                            </label>
                            <input type="password" id="confirmPassword" autocomplete="off" placeholder="Repite tu nueva contraseña">
                        </div>
                    </div>

                    <div class="form-actions" style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='/'">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="scripts/auth.js"></script>
    <script src="scripts/perfil.js"></script>
</body>
</html>
